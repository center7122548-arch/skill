services:
  - type: web
    name: chronoswap
    runtime: python
    plan: free
    buildCommand: echo "no dependencies to install"
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: CHRONOSWAP_DB
        value: /tmp/chronoswap.sqlite3
      - key: CHRONOSWAP_SEED_DEMO
        value: "1"
      - key: CHRONOSWAP_COOKIE_SECURE
        value: "1"
      - key: CHRONOSWAP_DEV_EMAIL_LINKS
        value: "1"
